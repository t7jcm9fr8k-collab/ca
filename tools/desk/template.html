<title>The Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a working ledger — what needs the owner first, then the two pipelines, each fact footnoted to its file. */
:root {
  --paper: #f3f5f1;      /* ledger paper, faint green bias */
  --sheet: #fbfcfa;
  --ink: #17242b;
  --ink-2: #4a5a60;
  --rule: #d3dbd5;
  --accent: #1f6f78;     /* teal-ink, the pen colour */
  --accent-soft: #dcebea;
  --good: #2f7a3d;  --good-bg: #e2f0e3;
  --warn: #9a6200;  --warn-bg: #f7ead2;
  --bad:  #a8322d;  --bad-bg:  #f6dfdd;
  --idle: #5d6a70;  --idle-bg: #e6eaea;
  --f-display: "Archivo Narrow", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #11181b; --sheet: #172126; --ink: #e3ebe8; --ink-2: #9fb0b3; --rule: #2a383d;
  --accent: #6cc1c8; --accent-soft: #1d3438;
  --good: #7fcf8a; --good-bg: #1c3221; --warn: #e5b45c; --warn-bg: #3a2d14;
  --bad: #f08b84; --bad-bg: #3d1f1d; --idle: #a3b0b4; --idle-bg: #243034; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #11181b; --sheet: #172126; --ink: #e3ebe8; --ink-2: #9fb0b3; --rule: #2a383d;
  --accent: #6cc1c8; --accent-soft: #1d3438;
  --good: #7fcf8a; --good-bg: #1c3221; --warn: #e5b45c; --warn-bg: #3a2d14;
  --bad: #f08b84; --bad-bg: #3d1f1d; --idle: #a3b0b4; --idle-bg: #243034; color-scheme: dark }

body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--f-body); }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 40px; }
h1, h2, h3, .label { font-family: var(--f-display); text-wrap: balance; }
h1 { font-size: 2.1rem; line-height: 1.1; margin: 0; letter-spacing: .01em; }
h2 { font-size: 1.35rem; margin: 0; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
h2 small { font: 500 .8rem var(--f-display); color: var(--ink-2); letter-spacing: .04em; text-transform: uppercase; }
h3 { font-size: 1.02rem; margin: 0; }
.label { font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); }
.mono, code, pre { font-family: var(--f-mono); font-size: .82rem; }
.num { font-variant-numeric: tabular-nums; }
section { display: grid; gap: 16px; min-width: 0; }
.muted { color: var(--ink-2); }
.src { font: .7rem var(--f-mono); color: var(--ink-2); word-break: break-all; }

header.top { display: grid; gap: 10px; border-bottom: 2px solid var(--ink); padding-bottom: 16px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: .88rem; color: var(--ink-2); }
.meta b { color: var(--ink); font-weight: 600; }

.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
.summary > div { background: var(--sheet); padding: 14px 16px; display: grid; gap: 2px; align-content: start; }
.summary .big { font: 600 1.9rem/1.1 var(--f-display); }

.pill { display: inline-block; font: 600 .7rem/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase;
  padding: 5px 8px 4px; border-radius: 3px; white-space: nowrap; }
.good { color: var(--good); background: var(--good-bg); }
.warn { color: var(--warn); background: var(--warn-bg); }
.bad  { color: var(--bad);  background: var(--bad-bg); }
.idle { color: var(--idle); background: var(--idle-bg); }

.actions { display: grid; gap: 12px; }
.action { background: var(--sheet); border: 1px solid var(--rule); border-left: 4px solid var(--accent);
  padding: 14px 16px; display: grid; gap: 8px; min-width: 0; }
.action .head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.action p { margin: 0; max-width: 68ch; }
.cmd { position: relative; background: var(--paper); border: 1px solid var(--rule); min-width: 0; }
.cmd pre { margin: 0; padding: 10px 12px; overflow-x: auto; white-space: pre; }
.cmd button { position: absolute; top: 6px; right: 6px; font: 600 .7rem var(--f-display); letter-spacing: .05em;
  text-transform: uppercase; background: var(--sheet); color: var(--accent); border: 1px solid var(--rule);
  padding: 4px 8px; cursor: pointer; border-radius: 3px; }
.cmd button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.tablewrap { overflow-x: auto; border: 1px solid var(--rule); background: var(--sheet); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th { font: 600 .72rem var(--f-display); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2);
  text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.q { max-width: 52ch; }

.coverage { display: grid; gap: 6px; }
.cov-row { display: grid; grid-template-columns: 9.5rem 1fr 4.5rem; gap: 10px; align-items: center; font-size: .8rem; }
.cov-row .bar { position: relative; height: 10px; background: var(--paper); border: 1px solid var(--rule); }
.cov-row .bar i { position: absolute; top: -1px; bottom: -1px; background: var(--accent); }
.axis { display: grid; grid-template-columns: 9.5rem 1fr 4.5rem; gap: 10px; font: .7rem var(--f-mono); color: var(--ink-2); }
.axis div { display: flex; justify-content: space-between; }

.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.card { background: var(--sheet); border: 1px solid var(--rule); padding: 14px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.card p { margin: 0; font-size: .9rem; }

details { background: var(--sheet); border: 1px solid var(--rule); padding: 10px 14px; }
summary { cursor: pointer; font: 600 .9rem var(--f-display); }
ul.plain { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: .9rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font: .75rem var(--f-mono); background: var(--accent-soft); color: var(--ink); padding: 3px 7px; border-radius: 3px; }
@media (max-width: 560px) { .cov-row, .axis { grid-template-columns: 6.5rem 1fr 3.6rem; } h1 { font-size: 1.7rem; } }
@media (prefers-reduced-motion: no-preference) { .cmd button { transition: background .15s; } }
</style>

<div class="wrap" id="app"><p class="muted">Loading the desk…</p></div>

<script>
const DESK = /*DESK*/null;
(function () {
  const app = document.getElementById("app");
  if (!DESK) { app.innerHTML = "<p>No data embedded. Run <code>python3 tools/desk/desk.py</code>.</p>"; return; }
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const M = DESK.market || {}, E = DESK.etsy || {}, A = (DESK.actions || {}).actions || [];

  function verdictClass(v) {
    v = String(v || "").toUpperCase();
    if (/DO NOT|NULL|FAIL|REFUT|BLOCK|NO EDGE|REJECT/.test(v)) return "bad";
    if (/PARTIAL|MIXED|WEAK|INCONCL/.test(v)) return "warn";
    if (/PASS|CONFIRM|SURVIV|EDGE/.test(v)) return "good";
    return "idle";
  }
  function stageClass(s) {
    s = String(s || "");
    if (/blocked/.test(s)) return "bad";
    if (/listed|passed|mocked/.test(s)) return "good";
    if (/proof/.test(s)) return "idle";
    return "warn";
  }
  const pill = (txt, cls) => `<span class="pill ${cls}">${esc(txt)}</span>`;
  const src = s => s ? `<div class="src">${esc(s)}</div>` : "";

  // ---- header + summary
  const head = M.head || {};
  const trials = M.trials || {};
  const designs = E.designs || [];
  const blocked = designs.filter(d => /blocked/.test(d.stage || "")).length;
  const tests = M.tests || [];
  let html = `
  <header class="top">
    <div class="label">Daniel's desk · branch claude/10k-revenue-slack-agents-iu8xu0</div>
    <h1>Where everything stands</h1>
    <div class="meta">
      <span>Built <b class="num">${esc(DESK.generated_at)}</b></span>
      <span>Head <b class="mono">${esc(head.commit)}</b> ${esc(head.subject)}</span>
      <span>Committed <b class="num">${esc(head.date)}</b></span>
    </div>
  </header>
  <div class="summary">
    <div><span class="label">Waiting on you</span><span class="big num">${A.length}</span><span class="muted">steps only you can take</span></div>
    <div><span class="label">Trials counted</span><span class="big num">${esc(trials.total ?? "—")}</span><span class="muted">deflation denominator</span></div>
    <div><span class="label">Pre-registered tests</span><span class="big num">${tests.length}</span><span class="muted">none cleared to trade</span></div>
    <div><span class="label">Designs</span><span class="big num">${designs.length}</span><span class="muted">${blocked} blocked on source plates</span></div>
  </div>`;

  // ---- actions
  // Grouped by effort (quick first); within a group, by how much care the step needs.
  const EFFORT = [["quick", "Quick · under five minutes"], ["medium", "Medium · one short sitting"],
                  ["involved", "Involved · an hour or more"], ["", "Not yet sized"]];
  const CARE = {routine: 0, check: 1, strict: 2};
  const careCls = {routine: "idle", check: "warn", strict: "bad"};
  const acts = A.slice().sort((a, b) => (CARE[a.care] ?? 3) - (CARE[b.care] ?? 3));
  html += `<section id="needs-you"><h2>Needs your hands <small>${A.length} steps · cloud sessions cannot reach these</small></h2><div class="actions">`;
  let idx = 0;
  EFFORT.forEach(([key, title]) => {
    const group = acts.filter(a => key ? a.effort === key : !EFFORT.some(([k]) => k && k === a.effort));
    if (!group.length) return;
    html += `<div class="label" style="margin-top:6px">${esc(title)} · ${group.length}</div>`;
    group.forEach(a => { const i = idx++;
    const cmds = (a.commands || []).join("\n");
    html += `<div class="action" style="border-left-color:var(--${a.care === "strict" ? "bad" : a.care === "check" ? "warn" : "accent"})">
      <div class="head">${a.care ? pill("care: " + a.care, careCls[a.care] || "idle") : ""}${pill(a.kind || "step", "idle")}<span class="label">${esc(a.area)}</span><h3>${esc(a.title)}</h3></div>
      ${a.why ? `<p>${esc(a.why)}</p>` : ""}
      ${a.unblocks ? `<p class="muted"><b>Unblocks:</b> ${esc(a.unblocks)}</p>` : ""}
      ${cmds ? `<div class="cmd"><button type="button" data-i="${i}">Copy</button><pre>${esc(cmds)}</pre></div>` : ""}
      ${src(a.source)}</div>`;
    });
  });
  html += `</div></section>`;

  // ---- market
  html += `<section id="market"><h2>Market research <small>tools/market</small></h2>`;
  if (tests.length) {
    html += `<div class="tablewrap"><table><thead><tr><th>Test</th><th>Date</th><th>Verdict</th><th>What it found</th></tr></thead><tbody>`;
    tests.forEach(t => {
      html += `<tr><td><b>${esc(t.name)}</b>${src(t.source)}</td><td class="num">${esc(t.date)}</td>
        <td>${pill(t.verdict || "—", verdictClass(t.verdict))}</td><td class="q">${esc(t.headline)}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  }

  const bars = (M.bars || []).filter(b => b.first_date && b.last_date);
  if (bars.length) {
    const t = d => Date.parse(d);
    const lo = Math.min(...bars.map(b => t(b.first_date))), hi = Math.max(...bars.map(b => t(b.last_date)));
    const span = Math.max(hi - lo, 1), yr = d => new Date(d).getUTCFullYear();
    html += `<div class="coverage"><div class="label">Daily bars in the repo · ${bars.length} files · ${yr(lo)}–${yr(hi)}</div>`;
    bars.forEach(b => {
      const l = (t(b.first_date) - lo) / span * 100, w = Math.max((t(b.last_date) - t(b.first_date)) / span * 100, .6);
      html += `<div class="cov-row"><span class="mono">${esc(b.file)}</span>
        <div class="bar" title="${esc(b.first_date)} → ${esc(b.last_date)}"><i style="left:${l.toFixed(2)}%;width:${w.toFixed(2)}%"></i></div>
        <span class="num muted">${esc(b.rows)} rows</span></div>`;
    });
    html += `<div class="axis"><span></span><div><span>${esc(new Date(lo).toISOString().slice(0,10))}</span><span>${esc(new Date(hi).toISOString().slice(0,10))}</span></div><span></span></div></div>`;
  }

  if ((M.grades || []).length) {
    html += `<details><summary>The fifteen ideas, as graded in EVIDENCE.md</summary><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>#</th><th>Idea</th><th>Grade</th></tr></thead><tbody>`;
    M.grades.forEach(g => { html += `<tr><td class="num">${esc(g.rank)}</td><td>${esc(g.idea)}</td><td>${esc(g.grade)}</td></tr>`; });
    html += `</tbody></table></div></details>`;
  }
  if ((M.strategies || []).length) {
    html += `<div class="chips" aria-label="Registered strategies">${M.strategies.map(s => `<span>${esc(s)}</span>`).join("")}</div>`;
  }
  if ((trials.open_questions || []).length) {
    html += `<details><summary>Open questions on how trials are counted (${trials.open_questions.length})</summary><ul class="plain">${trials.open_questions.map(q => `<li>${esc(q)}</li>`).join("")}</ul>${src(trials.source)}</details>`;
  }
  html += `</section>`;

  // ---- etsy
  html += `<section id="etsy"><h2>Etsy shop <small>tools/etsy</small></h2><div class="board">`;
  designs.forEach(d => {
    const srcs = d.sources || [];
    const have = srcs.filter(s => s.present).length;
    html += `<div class="card"><div>${pill(d.stage || "unknown", stageClass(d.stage))}</div>
      <h3>${esc(d.title || d.id)}</h3>
      ${d.blocked_on ? `<p class="muted">${esc(d.blocked_on)}</p>` : ""}
      ${srcs.length ? `<p class="num">${have} of ${srcs.length} source plates present</p>` : ""}
      ${d.versions ? `<p class="num">${esc(d.versions)} inspected version${d.versions == 1 ? "" : "s"}</p>` : ""}
      ${src(d.source)}</div>`;
  });
  html += `</div>`;
  const bits = [];
  if (E.listings) bits.push(`Listings: <b class="num">${esc(E.listings.count)}</b> written, <b class="num">${esc(E.listings.errors)}</b> SEO errors`);
  if (E.calendar) bits.push(`Posting calendar: <b class="num">${esc(E.calendar.slots)}</b> slots in <span class="mono">${esc(E.calendar.file)}</span>`);
  if (E.sources_dir) bits.push(`<span class="mono">tools/etsy/sources/</span> holds <b class="num">${(E.sources_dir.files || []).length}</b> files`);
  if (bits.length) html += `<p>${bits.join(" · ")}</p>`;
  html += `</section>`;

  // ---- warnings
  const warns = [].concat(M.warnings || [], E.warnings || [], (DESK.actions || {}).warnings || []);
  if (warns.length) html += `<details><summary>Collector warnings (${warns.length})</summary><ul class="plain">${warns.map(w => `<li>${esc(w)}</li>`).join("")}</ul></details>`;
  html += `<p class="src">Rebuild: python3 tools/desk/desk.py — reads only files in the repo. Every row above names the file it came from.</p>`;

  app.innerHTML = html;
  app.addEventListener("click", e => {
    const b = e.target.closest("button[data-i]"); if (!b) return;
    const pre = b.nextElementSibling;
    const done = ok => { b.textContent = ok ? "Copied" : "Select ↓"; setTimeout(() => b.textContent = "Copy", 1600); };
    const sel = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); done(false); };
    try { navigator.clipboard.writeText(pre.textContent).then(() => done(true), sel); } catch (_) { sel(); }
  });
})();
</script>
